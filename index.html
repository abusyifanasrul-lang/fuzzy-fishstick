<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Platformer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Pocket Platformer</h1>
        <p>Reach the flag. Use the on-screen controls or arrow keys.</p>
      </header>
      <section class="game-wrapper">
        <canvas id="game" width="360" height="640" aria-label="platformer game"></canvas>
        <div class="hud">
          <span id="status">Collect 3 stars to boost your jump.</span>
        </div>
      </section>
      <section class="controls">
        <button id="left" aria-label="Move left">◀</button>
        <button id="jump" aria-label="Jump">⬆</button>
        <button id="right" aria-label="Move right">▶</button>
      </section>
      <section class="tips">
        <h2>How to play</h2>
        <ul>
          <li>Tap and hold ◀ ▶ to move.</li>
          <li>Tap ⬆ to jump.</li>
          <li>Collect stars to gain a higher jump.</li>
        </ul>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
